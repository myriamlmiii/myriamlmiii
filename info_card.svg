</g>
<rect x="20" y="372" width="24" height="24" rx="4" fill="#ff5f56" opacity="0" style="animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) 2.00s forwards, glowPulse 2s ease-in-out 2.30s infinite;"/>
<rect x="50" y="372" width="24" height="24" rx="4" fill="#ffbd2e" opacity="0" style="animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) 2.06s forwards, glowPulse 2s ease-in-out 2.36s infinite;"/>
