<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" width="440" height="460">
<defs>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#39d353;stop-opacity:0.6"/>
            <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
            <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0.6"/>
        </linearGradient>
    

        <linearGradient id="barPython" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#39d353;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#39d353;stop-opacity:0.4"/>
        </linearGradient>
        

        <linearGradient id="barMLDL" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.4"/>
        </linearGradient>
        

        <linearGradient id="barNLP" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#bc8cff;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0.4"/>
        </linearGradient>
        

        <linearGradient id="barReact" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f0883e;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#f0883e;stop-opacity:0.4"/>
        </linearGradient>
        

        <linearGradient id="barCloud" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#e3b341;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#e3b341;stop-opacity:0.4"/>
        </linearGradient>
        
</defs>
<style>

        .bg { fill: #0d1117; }
        text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; }
        .small { font-size: 10px; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes fillBar {
            from { width: 0; }
        }
        @keyframes glowPulse {
            0%, 100% { filter: none; opacity: 0.9; }
            50% { filter: url(#glow); opacity: 1; }
        }
    
</style>
<rect class="bg" width="440" height="460" rx="10"/>
<rect width="440" height="460" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56" opacity="0.9"/>
<circle cx="42" cy="18" r="6" fill="#ffbd2e" opacity="0.9"/>
<circle cx="64" cy="18" r="6" fill="#27c93f" opacity="0.9"/>
<text x="220" y="21" text-anchor="middle" fill="#8b949e" font-size="11" opacity="0.7">neofetch</text>
