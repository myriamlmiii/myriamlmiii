<rect x="90" y="313" height="10" rx="5" fill="url(#barReact)" width="224" style="animation: fillBar 0.8s ease 2.05s backwards;"/>
<text x="418" y="322" fill="#f0883e" class="small" font-weight="bold">70%</text>
</g>
<g opacity="0" style="animation: slideIn 0.3s ease 2.00s forwards;">
<text x="20" y="342" fill="#8b949e" class="small">Cloud</text>
<rect x="90" y="333" width="320" height="10" rx="5" fill="#30363d" opacity="0.5"/>
<rect x="90" y="333" height="10" rx="5" fill="url(#barCloud)" width="208" style="animation: fillBar 0.8s ease 2.20s backwards;"/>
