<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460">
<defs>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#39d353;stop-opacity:0.6"/>
            <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
            <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0.6"/>
        </linearGradient>
        <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#39d353;stop-opacity:0">
                <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite"/>
            </stop>
            <stop offset="15%" style="stop-color:#69f0a0;stop-opacity:0.7">
                <animate attributeName="offset" values="-0.35;1.65" dur="3s" repeatCount="indefinite"/>
            </stop>
            <stop offset="30%" style="stop-color:#39d353;stop-opacity:0">
                <animate attributeName="offset" values="-0.2;1.8" dur="3s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>
    
</defs>
<style>

        .bg { fill: #0d1117; }
        .ascii { fill: #39d353; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 11px; filter: url(#glow); }
        .cmd { fill: #39d353; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; font-weight: bold; }
        .info { fill: #8b949e; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; }
        .name { fill: #58a6ff; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; font-weight: bold; }
        .role { fill: #bc8cff; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; }
        .border { fill: #30363d; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12.5px; }

        @keyframes typeIn {
            from { clip-path: inset(0 100% 0 0); opacity: 0.3; }
            to   { clip-path: inset(0 0% 0 0); opacity: 1; }
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.15; }
        }
        @keyframes asciiGlow {
            0%, 100% { filter: url(#glow); opacity: 0.9; }
            50% { filter: url(#strongGlow); opacity: 1; }
        }
        .scanline {
            animation: pulse 4s ease-in-out infinite;
        }
        .cursor {
            fill: #69f0a0;
            filter: url(#strongGlow);
            animation: blink 0.8s step-end infinite;
        }
    
</style>
